<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Deploy Center icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111b31"/>
      <stop offset="1" stop-color="#1f2f4d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d690"/>
      <stop offset="1" stop-color="#b9872d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="34" y="34" width="444" height="444" rx="96" fill="none" stroke="#ffffff22" stroke-width="2"/>

  <g transform="translate(256 256)">
    <polygon points="0,-182 174,128 -174,128" fill="none" stroke="url(#gold)" stroke-width="26" stroke-linejoin="round"/>
    <polygon points="0,-74 86,84 -86,84" fill="url(#gold)" opacity="0.22"/>
    <circle cx="0" cy="2" r="18" fill="#fbe6ba" filter="url(#glow)"/>
  </g>
</svg>
